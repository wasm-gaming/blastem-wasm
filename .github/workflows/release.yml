name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  wasm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update -qq && apt-get install -y -qq wget
          make build-wasm-ci
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist/blastem/blastem.*

  release:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Must match the Environment configured for npm Trusted Publisher.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # The version is stamped *before* building, so the SDK's static version, the
      # package and the tag agree (scripts/sync-version.mjs writes all three places).
      - name: Stamp the new version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          node scripts/sync-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: make test demo
      - uses: actions/download-artifact@v4
        with: { name: wasm-dist, path: dist/blastem }

      - name: Commit and tag
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git commit -am "chore(release): ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - run: npm install -g npm@latest
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
      - run: git push origin HEAD --follow-tags

      # The launcher fetches <id>.tar.gz and reads <id>/<id>/ inside it.
      - name: Package the release archive
        run: |
          cp -r dist blastem
          tar -czf blastem.tar.gz blastem
          zip -qr blastem.zip blastem
          tar -tzf blastem.tar.gz | grep -q '^blastem/blastem/blastem.sdk.js$'
          tar -tzf blastem.tar.gz | grep -q '^blastem/blastem/blastem.wasm$'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            blastem.tar.gz
            blastem.zip
